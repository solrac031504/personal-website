name: "Personal Website CI"

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-website
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: personal-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: personal-website/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('personal-website/package-lock.json') }}-${{ hashFiles('personal-website/**/*.js', 'personal-website/**/*.jsx', 'personal-website/**/*.ts', 'personal-website/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('personal-website/package-lock.json') }}-

      - name: Build application
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-website
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: personal-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint